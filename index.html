<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StandBy Clock">
<meta name="theme-color" content="#000000">
<meta name="description" content="An always-on, StandBy-style nightstand clock for iPhones without an always-on display. Add it to your Home Screen.">
<title>StandBy Clock</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root {
    --white: #ffffff;
    --tick-major-a: #9f9f9f;
    --tick-minor-a: #474747;
    --tick-major-b: #f3f2f8;
    --tick-minor-b: #525252;
    --second: #e8913a;
    --red: #f14b39;
    --gray: #84848a;
    --day-opacity: 1;
    --night-opacity: .45;
    --shift-x: 0px;
    --shift-y: 0px;
    /* Set by JS from the (possibly rotated) clock area, so layouts don't depend on the screen's orientation. */
    --vh: 1vh;
    --vw: 1vw;
    --wu: 1vh;        /* widget unit: 1/100 of the widget area's height */
  }
  body.night {
    --white: #ff3b2a; --tick-major-a: #b02414; --tick-minor-a: #4a0f08;
    --tick-major-b: #ff3b2a; --tick-minor-b: #5a130a;
    --second: #ff3b2a; --red: #ff3b2a; --gray: #8a1d10;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: #000; color: var(--white); overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  }

  /* #rot is the clock's "screen". It is rotated 90° when the chosen orientation differs from the phone's. */
  #rot { position: fixed; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #000; }
  #stage {
    position: absolute; inset: 0;
    transform: translate(var(--shift-x), var(--shift-y));
    transition: transform 2s ease-in-out, opacity 3s ease;
    opacity: var(--day-opacity);
  }
  body.night #stage { opacity: var(--night-opacity); }

  .face { display: none; position: absolute; inset: 0; }
  .face.active { display: block; }
  svg text { font-family: inherit; }

  /* ---------- Face 1: full-screen dial ---------- */
  #svgA { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---------- Face 2: dial + widget stack ---------- */
  #dialB { position: absolute; overflow: visible; }   /* size/position set in JS */
  #stackB { position: absolute; left: calc(54.7 * var(--vw) - 5 * var(--vh)); right: 0; top: 0; bottom: 0; overflow: hidden; }
  body.portrait #stackB { left: 0; top: calc(50 * var(--vh)); }
  #trackB { position: absolute; inset: 0; transition: transform .55s cubic-bezier(.25,.8,.25,1); }
  .widget { position: absolute; left: calc(5 * var(--wu)); right: 0; height: 100%; }
  body.portrait .widget { left: calc(7 * var(--vw)); }

  .w-weather .city { position: absolute; top: calc(7.6 * var(--wu)); left: calc(1.1 * var(--wu)); font-size: calc(9.2 * var(--wu)); font-weight: 600; line-height: 1; white-space: nowrap; display: flex; align-items: center; gap: calc(2.2 * var(--wu)); }
  .w-weather .city svg { width: calc(5.4 * var(--wu)); height: calc(5.4 * var(--wu)); fill: var(--white); }
  .w-weather .temp { position: absolute; top: calc(16.5 * var(--wu)); left: 0; font-size: calc(42.5 * var(--wu)); font-weight: 500; line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .w-weather .icon { position: absolute; top: calc(63.5 * var(--wu)); left: calc(1.1 * var(--wu)); width: calc(9.6 * var(--wu)); height: calc(7.2 * var(--wu)); }
  .w-weather .icon svg { width: 100%; height: 100%; stroke: var(--white); fill: none; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .w-weather .cond { position: absolute; top: calc(74.6 * var(--wu)); left: calc(1.1 * var(--wu)); font-size: calc(7.8 * var(--wu)); font-weight: 500; line-height: 1; white-space: nowrap; }
  .w-weather .lohi { position: absolute; top: calc(84.6 * var(--wu)); left: calc(1.1 * var(--wu)); font-size: calc(7.8 * var(--wu)); font-weight: 500; line-height: 1; white-space: nowrap; }
  .w-weather .msg { position: absolute; top: calc(40 * var(--wu)); left: calc(1.1 * var(--wu)); right: calc(4 * var(--wu)); font-size: calc(5 * var(--wu)); color: var(--gray); line-height: 1.25; }

  .w-cal .month { position: absolute; top: calc(9.4 * var(--wu)); left: calc(-0.4 * var(--wu)); font-size: calc(6.4 * var(--wu)); font-weight: 600; color: var(--red); line-height: 1; letter-spacing: .01em; }
  .w-cal .cell { position: absolute; width: calc(11.7 * var(--wu)); height: calc(11.7 * var(--wu)); margin: calc(-5.85 * var(--wu)) 0 0 calc(-5.85 * var(--wu)); display: flex; align-items: center; justify-content: center; font-size: calc(5.9 * var(--wu)); font-weight: 600; font-variant-numeric: tabular-nums; }
  .w-cal .dow { font-size: calc(5 * var(--wu)); font-weight: 500; }
  .w-cal .we { color: var(--gray); }
  .w-cal .today::before { content: ""; position: absolute; width: calc(10.4 * var(--wu)); height: calc(10.4 * var(--wu)); border-radius: 50%; background: var(--red); z-index: -1; }
  .w-cal .today { color: #fff; z-index: 0; }
  body.night .w-cal .today { color: #000; }

  .w-time .t { position: absolute; top: calc(18 * var(--wu)); left: 0; font-size: calc(42 * var(--wu)); font-weight: 600; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .w-time .d { position: absolute; top: calc(72 * var(--wu)); left: calc(1.2 * var(--wu)); font-size: calc(8.8 * var(--wu)); font-weight: 600; line-height: 1; }
  .w-time .d b { color: var(--red); font-weight: 600; }

  #vdots { position: absolute; right: calc(1.6 * var(--vh)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: calc(1.2 * var(--vh)); opacity: 0; transition: opacity .5s; }
  body.portrait #vdots { top: 75%; right: calc(2 * var(--vw)); }
  #vdots span { width: 7px; height: 7px; border-radius: 50%; background: #3a3a3c; }
  #vdots span.on { background: #f2f2f7; }
  #vdots.show { opacity: 1; }

  /* ---------- Face 3: big digital ---------- */
  #fD .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #fD .date { font-size: calc(7 * var(--vh)); font-weight: 600; line-height: 1; margin-bottom: calc(1 * var(--vh)); }
  #fD .date b { color: var(--red); font-weight: 600; }
  #fD .time { font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; font-size: min(calc(62 * var(--vh)), calc(30 * var(--vw))); font-weight: 700; line-height: .95; letter-spacing: -.02em; font-variant-numeric: tabular-nums; display: flex; }
  body.portrait #fD .date { font-size: calc(7.5 * var(--vw)); margin-bottom: calc(3 * var(--vw)); }
  body.portrait #fD .time { flex-direction: column; align-items: center; font-size: calc(52 * var(--vw)); line-height: .88; }
  body.portrait #fD .sep { display: none; }

  /* ---------- UI chrome (inside #rot, so it rotates with the clock) ---------- */
  #dots { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #dots span { width: 7px; height: 7px; border-radius: 50%; background: #48484a; }
  #dots span.on { background: #f2f2f7; }
  body.ui #dots { opacity: 1; }
  #gear {
    position: absolute; top: 14px; right: 16px; width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: #1c1c1e; color: #f2f2f7; font-size: 20px; opacity: 0; pointer-events: none; transition: opacity .4s; z-index: 5;
  }
  body.portrait #gear { top: 56px; }
  body.ui #gear { opacity: 1; pointer-events: auto; }

  #settings { position: absolute; inset: 0; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; z-index: 10; touch-action: pan-y; }
  #settings.open { display: flex; }
  #settings .card {
    background: #1c1c1e; color: #f2f2f7; border-radius: 18px; padding: 18px 20px;
    width: min(660px, 92%); max-height: 90%; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; font-size: 15px;
  }
  body.portrait #settings .card { grid-template-columns: 1fr; max-height: 80%; }
  #settings h2 { grid-column: 1 / -1; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
  #settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 36px; }
  #settings input[type=time], #settings select, #settings input[type=number], #settings input[type=text] {
    background: #2c2c2e; color: #f2f2f7; border: 0; border-radius: 8px; padding: 6px 8px; font-size: 16px; font-family: inherit;
  }
  #settings input[type=number] { width: 70px; }
  #settings input[type=text] { width: 150px; }
  #settings input[type=range] { width: 130px; }
  #settings input[type=checkbox] { width: 22px; height: 22px; accent-color: #30d158; }
  #settings .status { grid-column: 1 / -1; font-size: 13px; color: #8e8e93; line-height: 1.45; margin-top: 4px; }
  #settings .close, #hint button { background: #0a84ff; color: #fff; border: 0; border-radius: 10px; padding: 7px 16px; font-size: 15px; font-weight: 600; }

  #hint { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.85); z-index: 20; }
  #hint.show { display: flex; }
  #hint .card { background: #1c1c1e; color: #f2f2f7; border-radius: 18px; padding: 20px 22px; width: min(440px, 90%); font-size: 15px; line-height: 1.45; }
  #hint h3 { font-size: 18px; margin-bottom: 8px; }
  #hint p { color: #c7c7cc; margin-bottom: 14px; }
  #hint .row { display: flex; justify-content: flex-end; gap: 10px; }
  #hint .later { background: #2c2c2e; }
</style>
</head>
<body>

<div id="rot">
  <div id="stage">
    <!-- Face 1: full-screen dial -->
    <section class="face" id="fA"><svg id="svgA"></svg></section>

    <!-- Face 2: dial + vertically swipeable widget stack -->
    <section class="face" id="fB">
      <svg id="dialB" viewBox="-100 -100 200 200"></svg>
      <div id="stackB"><div id="trackB">
        <div class="widget w-weather" id="wWeather"></div>
        <div class="widget w-cal" id="wCal"></div>
        <div class="widget w-time" id="wTime"><div class="t" id="wtT"></div><div class="d" id="wtD"></div></div>
      </div></div>
      <div id="vdots"></div>
    </section>

    <!-- Face 3: big digital -->
    <section class="face" id="fD"><div class="wrap"><div class="date" id="dDate"></div><div class="time" id="dTime"></div></div></section>
  </div>

  <div id="dots"></div>
  <button id="gear" aria-label="Settings">⚙︎</button>

  <div id="settings">
    <div class="card">
      <h2>Settings <button class="close" id="closeSettings">Done</button></h2>
      <label>Orientation
        <select id="sOrient">
          <option value="follow">Follow phone</option>
          <option value="landscape-cw">Always landscape ↻</option>
          <option value="landscape-ccw">Always landscape ↺</option>
          <option value="portrait">Always portrait</option>
        </select>
      </label>
      <label>24-hour digital time <input type="checkbox" id="s24"></label>
      <label>Second hand <input type="checkbox" id="sSecs"></label>
      <label>Smooth sweep <input type="checkbox" id="sSmooth"></label>
      <label>Day brightness <input type="range" id="sDim" min="0.25" max="1" step="0.05"></label>
      <label>Night mode
        <select id="sNight"><option value="auto">Auto (schedule)</option><option value="on">Always on</option><option value="off">Off</option></select>
      </label>
      <label>Night brightness <input type="range" id="sNightDim" min="0.15" max="0.8" step="0.05"></label>
      <label>Night starts <input type="time" id="sNightStart"></label>
      <label>Night ends <input type="time" id="sNightEnd"></label>
      <label>Weather city <input type="text" id="sCity" placeholder="Current location"></label>
      <label>Units <select id="sUnits"><option value="C">°C</option><option value="F">°F</option></select></label>
      <label>Week starts <select id="sWeek"><option value="0">Sunday</option><option value="1">Monday</option></select></label>
      <label>Rotate widgets (min, 0=off) <input type="number" id="sWRotate" min="0" max="240"></label>
      <label>Pixel shift every (s) <input type="number" id="sShiftEvery" min="10" max="600"></label>
      <label>Shift range (px) <input type="number" id="sShiftPx" min="0" max="30"></label>
      <label>Rotate faces (min, 0=off) <input type="number" id="sRotate" min="0" max="240"></label>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div id="hint">
    <div class="card">
      <h3>Add to Home Screen for full screen</h3>
      <p>You're in a Safari tab, so the browser bars are visible. Tap <b>Share</b> → <b>Add to Home Screen</b>, then open the clock from its new icon. It will run full-screen with no browser UI.</p>
      <div class="row"><button class="later" id="hintLater">Not now</button><button id="hintOk">Got it</button></div>
    </div>
  </div>
</div>

<script>
(() => {
  // ================= Settings =================
  const DEFAULTS = {
    orient: 'follow', h24: true, secs: true, smooth: true, dim: 1,
    night: 'auto', nightDim: 0.45, nightStart: '22:30', nightEnd: '07:00',
    city: '', units: 'C', week: 0, wRotate: 10,
    shiftEvery: 60, shiftPx: 8, rotateMin: 0, face: 0, widget: 0
  };
  const KEY = 'standbyclock';
  let S = { ...DEFAULTS };
  try { S = { ...DEFAULTS, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const faces = [...document.querySelectorAll('.face')];
  const fmt = (n, d = 2) => +n.toFixed(d);
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;

  // ================= Orientation / layout =================
  // rot: 0 = none, 90 = rotated clockwise, -90 = counter-clockwise.
  let rot = 0, SW = 0, SH = 0, portrait = false;
  function layout() {
    const w = innerWidth, h = innerHeight;
    const phoneLand = w > h;
    let want;
    if (S.orient === 'follow') want = phoneLand ? 'land' : 'port';
    else want = S.orient === 'portrait' ? 'port' : 'land';
    rot = 0;
    if ((want === 'land') !== phoneLand) rot = S.orient === 'landscape-ccw' ? -90 : (S.orient === 'portrait' ? -90 : 90);
    SW = rot ? h : w; SH = rot ? w : h;
    const r = $('rot');
    r.style.width = SW + 'px'; r.style.height = SH + 'px';
    r.style.transform = rot === 90 ? `translate(${w}px,0) rotate(90deg)` : rot === -90 ? `translate(0,${h}px) rotate(-90deg)` : 'none';
    portrait = SW < SH;
    document.body.classList.toggle('portrait', portrait);
    root.style.setProperty('--vh', SH / 100 + 'px');
    root.style.setProperty('--vw', SW / 100 + 'px');
    root.style.setProperty('--wu', (portrait ? SH * .5 : SH) / 100 + 'px');
    // dial on the split face
    const d = $('dialB');
    let size, cx, cy;
    if (portrait) { size = Math.min(SW * .88, SH * .46); cx = SW / 2; cy = SH * .265; }
    else { size = SH * .86; cx = SW * .275; cy = SH * .512; }
    Object.assign(d.style, { width: size + 'px', height: size + 'px', left: (cx - size / 2) + 'px', top: (cy - size / 2) + 'px' });
    buildA();
    const now = new Date();
    lastDateKey = '';
    drawHands(now);
    updateText(now);
  }
  // Convert a screen point/delta into clock-area coordinates.
  const toStage = (x, y) => rot === 90 ? [y, innerWidth - x] : rot === -90 ? [innerHeight - y, x] : [x, y];
  const deltaToStage = (dx, dy) => rot === 90 ? [dy, -dx] : rot === -90 ? [-dy, dx] : [dx, dy];

  // ================= Hands =================
  // Rotated with the SVG transform attribute: CSS transform-origin on SVG is unreliable in iOS Safari.
  function handSVG(cls, cx, cy, stemLen, stemW, len, w, color) {
    return `<g class="${cls}" transform="rotate(0 ${cx} ${cy})">
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${fmt(cy - stemLen - w / 2)}" stroke="${color}" stroke-width="${stemW}" stroke-linecap="round"/>
      <line x1="${cx}" y1="${fmt(cy - stemLen)}" x2="${cx}" y2="${fmt(cy - len + w / 2)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>
    </g>`;
  }
  function secondSVG(cx, cy, fwd, back, w, hubW, hubO, hubB) {
    return `<circle cx="${cx}" cy="${cy}" r="${hubW}" fill="var(--white)"/>
      <g class="hs" transform="rotate(0 ${cx} ${cy})">
        <line x1="${cx}" y1="${fmt(cy + back)}" x2="${cx}" y2="${fmt(cy - fwd)}" stroke="var(--second)" stroke-width="${w}" stroke-linecap="round"/>
      </g>
      <circle cx="${cx}" cy="${cy}" r="${hubO}" fill="var(--second)"/>
      <circle cx="${cx}" cy="${cy}" r="${hubB}" fill="#000"/>`;
  }

  // ================= Face 1: full-screen dial =================
  // Ticks run along rays from the centre and end on the screen edge, so the dial follows the
  // screen's rectangle. Sizes are fractions of U = the shorter side.
  let A = null;
  function buildA() {
    const svg = $('svgA');
    const W = SW, H = SH, U = Math.min(W, H);
    if (!W || !H) return;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const cx = W / 2, cy = H / 2;
    let html = '';
    for (let i = 0; i < 60; i++) {
      const a = i * Math.PI / 30, sx = Math.sin(a), sy = -Math.cos(a);
      const t = Math.min(Math.abs(sx) > 1e-6 ? (W / 2) / Math.abs(sx) : Infinity,
                         Math.abs(sy) > 1e-6 ? (H / 2) / Math.abs(sy) : Infinity);
      const ox = cx + sx * t, oy = cy + sy * t;
      // the two numerals on the short axis get a short tick, the other two a long one
      const shortAxis = W >= H ? (i === 0 || i === 30) : (i === 15 || i === 45);
      let len, w, col;
      if (i % 15 === 0)     { len = shortAxis ? .05 * U : .19 * U; w = .0075 * U; col = 'var(--tick-major-a)'; }
      else if (i % 5 === 0) { len = .18 * U;  w = .0075 * U; col = 'var(--tick-major-a)'; }
      else                  { len = .062 * U; w = .0055 * U; col = 'var(--tick-minor-a)'; }
      html += `<line x1="${fmt(ox)}" y1="${fmt(oy)}" x2="${fmt(ox - sx * len)}" y2="${fmt(oy - sy * len)}" stroke="${col}" stroke-width="${fmt(w)}" stroke-linecap="round"/>`;
    }
    const fs = .125 * U;
    const num = (n, x, y) => `<text transform="translate(${fmt(x)} ${fmt(y)}) scale(1.3 1)" text-anchor="middle" dominant-baseline="central" font-size="${fmt(fs)}" font-weight="600" fill="var(--white)">${n}</text>`;
    const land = W >= H;
    const x3 = W - .284 * U, x9 = .29 * U;
    const y12 = land ? .124 * U : .29 * U, y6 = land ? H - .112 * U : H - .29 * U;
    html += num(12, cx, y12) + num(3, x3, cy) + num(6, cx, y6) + num(9, x9, cy);
    const dateAttrs = land
      ? `x="${fmt(x3 - .142 * U)}" y="${fmt(cy)}" text-anchor="end"`
      : `x="${fmt(cx)}" y="${fmt(cy + .3 * U)}" text-anchor="middle"`;
    html += `<text ${dateAttrs} dominant-baseline="central" font-size="${fmt(.058 * U * (land ? 1 : 1.25))}" font-weight="500"><tspan fill="var(--red)" class="aDow"></tspan><tspan fill="var(--white)" class="aDay"></tspan></text>`;
    const L = land ? 1 : 1.35;   // longer hands on the taller portrait dial
    html += handSVG('hh', cx, cy, .065 * U, .012 * U, .26 * U * L, .038 * U, 'var(--white)');
    html += handSVG('hm', cx, cy, .065 * U, .012 * U, .455 * U * (land ? 1 : .98), .038 * U, 'var(--white)');
    html += secondSVG(cx, cy, .5 * U * (land ? 1 : .96), .088 * U, .006 * U, .024 * U, .015 * U, .006 * U);
    svg.innerHTML = html;
    A = { cx, cy, h: svg.querySelector('.hh'), m: svg.querySelector('.hm'), s: svg.querySelector('.hs'),
          dow: svg.querySelector('.aDow'), day: svg.querySelector('.aDay') };
    lastDateKey = '';
  }

  // ================= Face 2: dial (viewBox -100..100, ticks end at r=98.5) =================
  let B;
  (function buildB() {
    const svg = $('dialB');
    let html = '';
    for (let i = 0; i < 60; i++) {
      const a = i * Math.PI / 30, sx = Math.sin(a), sy = -Math.cos(a);
      const major = i % 5 === 0, r2 = 98.5, r1 = major ? 91.5 : 92.5;
      html += `<line x1="${fmt(sx * r1)}" y1="${fmt(sy * r1)}" x2="${fmt(sx * r2)}" y2="${fmt(sy * r2)}" stroke="var(${major ? '--tick-major-b' : '--tick-minor-b'})" stroke-width="${major ? 1.9 : 1.7}" stroke-linecap="round"/>`;
    }
    for (let h = 1; h <= 12; h++) {
      const a = h * Math.PI / 6;
      html += `<text x="${fmt(Math.sin(a) * 75.5)}" y="${fmt(-Math.cos(a) * 75.5)}" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="500" fill="var(--white)">${h}</text>`;
    }
    html += handSVG('hh', 0, 0, 13, 2.3, 56, 6.2, 'var(--white)');
    html += handSVG('hm', 0, 0, 13, 2.3, 95, 6.2, 'var(--white)');
    html += secondSVG(0, 0, 99, 16, 1, 5, 3.2, 1.4);
    svg.innerHTML = html;
    B = { cx: 0, cy: 0, h: svg.querySelector('.hh'), m: svg.querySelector('.hm'), s: svg.querySelector('.hs') };
  })();

  function setRot(el, deg, cx, cy) { el.setAttribute('transform', `rotate(${fmt(deg, 3)} ${cx} ${cy})`); }
  function drawHands(now, onlySeconds) {
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds(), ms = now.getMilliseconds();
    const sec = S.smooth ? s + ms / 1000 : s;
    for (const d of [A, B]) {
      if (!d) continue;
      d.s.style.display = S.secs ? '' : 'none';
      if (S.secs) setRot(d.s, sec * 6, d.cx, d.cy);
      if (onlySeconds) continue;
      setRot(d.h, (h % 12) * 30 + m * .5 + s / 120, d.cx, d.cy);
      setRot(d.m, m * 6 + s * .1, d.cx, d.cy);
    }
  }

  // ================= Calendar widget =================
  const wu = n => `calc(${fmt(n)} * var(--wu))`;
  function renderCal(now) {
    const y = now.getFullYear(), mo = now.getMonth(), today = now.getDate();
    const ws = Number(S.week);
    const startDow = (new Date(y, mo, 1).getDay() - ws + 7) % 7;
    const days = new Date(y, mo + 1, 0).getDate();
    const weeks = Math.ceil((startDow + days) / 7);
    const rowH = weeks > 5 ? 10.6 : 12.4, firstRow = weeks > 5 ? 35.4 : 36.9, dowY = weeks > 5 ? 23.6 : 24.5;
    const colX = c => 2.4 + c * 11.2;
    const isWe = c => { const d = (c + ws) % 7; return d === 0 || d === 6; };
    const letters = ['S','M','T','W','T','F','S'];
    let html = `<div class="month">${now.toLocaleDateString('en-US', { month: 'long' }).toUpperCase()}</div>`;
    for (let c = 0; c < 7; c++) html += `<div class="cell dow${isWe(c) ? ' we' : ''}" style="left:${wu(colX(c))};top:${wu(dowY)}">${letters[(c + ws) % 7]}</div>`;
    for (let d = 1; d <= days; d++) {
      const idx = startDow + d - 1, c = idx % 7, r = Math.floor(idx / 7);
      const cls = d === today ? 'today' : (isWe(c) ? 'we' : '');
      html += `<div class="cell ${cls}" style="left:${wu(colX(c))};top:${wu(firstRow + r * rowH)}">${d}</div>`;
    }
    $('wCal').innerHTML = html;
  }

  // ================= Weather widget (Open-Meteo, no API key) =================
  const ICON = {
    sun: '<circle cx="16" cy="12" r="4.5"/><path d="M16 2.5v2.2M16 19.3v2.2M6.5 12H4.3M27.7 12h-2.2M9.3 5.3l1.5 1.5M21.2 17.2l1.5 1.5M9.3 18.7l1.5-1.5M21.2 6.8l1.5-1.5"/>',
    moon: '<path d="M20.5 3.5a9 9 0 1 0 6.8 12.6A8 8 0 0 1 20.5 3.5z"/>',
    cloud: '<path d="M9.5 20.5h13a4.8 4.8 0 0 0 .6-9.6 7 7 0 0 0-13.3 1.6 4 4 0 0 0-.3 8z"/>',
    partly: '<path d="M10.5 6.5a4.5 4.5 0 0 1 7 2.5M8.5 1.8v1.6M3.5 7H2M4.6 3.1l1.1 1.1"/><path d="M11.5 22h11a4.3 4.3 0 0 0 .6-8.6 6.2 6.2 0 0 0-11.8 1.4 3.6 3.6 0 0 0 .2 7.2z"/>',
    rain: '<path d="M9.5 15.5h13a4.8 4.8 0 0 0 .6-9.6 7 7 0 0 0-13.3 1.6 4 4 0 0 0-.3 8z"/><path d="M11 19l-1.5 3.5M16 19l-1.5 3.5M21 19l-1.5 3.5"/>',
    snow: '<path d="M9.5 15.5h13a4.8 4.8 0 0 0 .6-9.6 7 7 0 0 0-13.3 1.6 4 4 0 0 0-.3 8z"/><path d="M11 20v.1M16 21v.1M21 20v.1M13.5 23v.1M18.5 23v.1"/>',
    storm: '<path d="M9.5 15.5h13a4.8 4.8 0 0 0 .6-9.6 7 7 0 0 0-13.3 1.6 4 4 0 0 0-.3 8z"/><path d="M17 17l-3 4h4l-3 4"/>',
    fog: '<path d="M5 9h22M3 14h20M7 19h22"/>',
    wind: '<path d="M3 9.5h15.5a3.5 3.5 0 1 0-3.5-3.5"/><path d="M3 14.5h21.5a3.5 3.5 0 1 1-3.5 3.5"/><path d="M3 19.5h10a3 3 0 1 1-3 3"/>'
  };
  const ARROW = '<svg viewBox="0 0 24 24"><path d="M21.5 2.5 2.8 10.4c-.9.4-.8 1.7.2 1.9l7.8 1.6 1.6 7.8c.2 1 1.5 1.1 1.9.2z"/></svg>';
  function describe(code, wind, isDay) {
    if (code === 0 || code === 1) {
      if (wind >= 30) return ['Windy', 'wind'];
      return [code === 0 ? (isDay ? 'Sunny' : 'Clear') : (isDay ? 'Mostly Sunny' : 'Mostly Clear'), isDay ? 'sun' : 'moon'];
    }
    if (code === 2) return wind >= 30 ? ['Windy', 'wind'] : ['Partly Cloudy', 'partly'];
    if (code === 3) return wind >= 30 ? ['Windy', 'wind'] : ['Cloudy', 'cloud'];
    if (code === 45 || code === 48) return ['Foggy', 'fog'];
    if (code >= 51 && code <= 57) return ['Drizzle', 'rain'];
    if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return [code >= 80 ? 'Showers' : (code >= 65 ? 'Heavy Rain' : 'Rain'), 'rain'];
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ['Snow', 'snow'];
    if (code >= 95) return ['Thunderstorms', 'storm'];
    return ['—', 'cloud'];
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let W = null;
  try { W = JSON.parse(localStorage.getItem(KEY + '.weather') || 'null'); } catch (e) {}
  function renderWeather(msg) {
    const el = $('wWeather');
    if (!W) { el.innerHTML = `<div class="msg">${esc(msg || 'Loading weather…')}</div>`; return; }
    const [text, icon] = describe(W.code, W.wind, W.isDay);
    el.innerHTML =
      `<div class="city">${esc(W.name)}${W.here ? ARROW : ''}</div>` +
      `<div class="temp">${Math.round(W.temp)}°</div>` +
      `<div class="icon"><svg viewBox="0 0 32 26">${ICON[icon]}</svg></div>` +
      `<div class="cond">${text}</div>` +
      `<div class="lohi">L:${Math.round(W.lo)}° H:${Math.round(W.hi)}°</div>`;
  }
  const getPos = () => new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('no geolocation'));
    navigator.geolocation.getCurrentPosition(p => res(p.coords), rej, { maximumAge: 6 * 3600e3, timeout: 15000 });
  });
  let weatherBusy = false;
  async function loadWeather() {
    if (weatherBusy) return;
    weatherBusy = true;
    try {
      let lat, lon, name, here = false;
      if (S.city.trim()) {
        const g = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name=${encodeURIComponent(S.city.trim())}`)).json();
        if (!g.results || !g.results.length) throw new Error(`City "${S.city}" not found`);
        ({ latitude: lat, longitude: lon, name } = g.results[0]);
      } else {
        const c = await getPos();
        lat = c.latitude; lon = c.longitude; here = true;
        try {
          const r = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`)).json();
          name = r.locality || r.city || r.principalSubdivision || 'My Location';
        } catch (e) { name = 'My Location'; }
      }
      const unit = S.units === 'F' ? '&temperature_unit=fahrenheit' : '';
      const f = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1${unit}`)).json();
      W = { name, here, temp: f.current.temperature_2m, code: f.current.weather_code, wind: f.current.wind_speed_10m,
            isDay: !!f.current.is_day, lo: f.daily.temperature_2m_min[0], hi: f.daily.temperature_2m_max[0], at: Date.now() };
      try { localStorage.setItem(KEY + '.weather', JSON.stringify(W)); } catch (e) {}
      renderWeather();
    } catch (err) {
      if (!W) renderWeather(err && err.code === 1
        ? 'Location access denied. Enter a city in Settings (tap the screen, then ⚙︎).'
        : `Weather unavailable (${(err && err.message) || 'error'}).`);
    } finally { weatherBusy = false; }
  }
  setInterval(loadWeather, 20 * 60e3);

  // ================= Widget stack =================
  const widgets = [...document.querySelectorAll('#trackB .widget')];
  widgets.forEach((w, i) => w.style.top = (i * 100) + '%');
  $('vdots').innerHTML = widgets.map(() => '<span></span>').join('');
  let dotsTimer;
  function setWidget(i, show = true) {
    S.widget = (i + widgets.length) % widgets.length;
    $('trackB').style.transform = `translateY(${-S.widget * 100}%)`;
    [...$('vdots').children].forEach((d, k) => d.classList.toggle('on', k === S.widget));
    if (show) {
      $('vdots').classList.add('show');
      clearTimeout(dotsTimer);
      dotsTimer = setTimeout(() => $('vdots').classList.remove('show'), 1800);
    }
    save();
  }
  let wRotTimer;
  function startWidgetRotate() {
    clearInterval(wRotTimer);
    if (S.wRotate > 0) wRotTimer = setInterval(() => setWidget(S.widget + 1, false), S.wRotate * 60e3);
  }

  // ================= Text / date updates =================
  const pad = n => String(n).padStart(2, '0');
  let lastDateKey = '';
  const hStr = h => S.h24 ? pad(h) : String(h % 12 || 12);
  function updateText(now) {
    const dowShort = now.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
    const dKey = now.toDateString() + S.week;
    if (dKey !== lastDateKey) {
      lastDateKey = dKey;
      if (A) { A.dow.textContent = dowShort; A.day.textContent = ' ' + now.getDate(); }
      renderCal(now);
      $('dDate').innerHTML = `<b>${now.toLocaleDateString('en-US', { weekday: 'long' })}</b> ${now.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}`;
      $('wtD').innerHTML = `<b>${dowShort}</b> ${now.getDate()}`;
    }
    const hh = hStr(now.getHours()), mm = pad(now.getMinutes());
    $('dTime').innerHTML = `<span>${hh}</span><span class="sep">:</span><span>${mm}</span>`;
    $('wtT').textContent = `${hh}:${mm}`;
  }

  // ================= Night mode =================
  const toMin = t => { const [a, b] = t.split(':').map(Number); return a * 60 + b; };
  function isNightNow(now) {
    if (S.night === 'on') return true;
    if (S.night === 'off') return false;
    const cur = now.getHours() * 60 + now.getMinutes();
    const a = toMin(S.nightStart), b = toMin(S.nightEnd);
    return a <= b ? (cur >= a && cur < b) : (cur >= a || cur < b);
  }

  // ================= Main loop =================
  function tick() {
    const now = new Date();
    drawHands(now, false);
    updateText(now);
    document.body.classList.toggle('night', isNightNow(now));
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  function sweep() {
    if (S.smooth && S.secs && document.visibilityState === 'visible') drawHands(new Date(), true);
    requestAnimationFrame(sweep);
  }

  // ================= Burn-in protection: pixel shift =================
  let lastShift = [0, 0], shiftTimer;
  function shift() {
    const r = S.shiftPx;
    let x, y, n = 0;
    do {
      x = Math.round((Math.random() * 2 - 1) * r);
      y = Math.round((Math.random() * 2 - 1) * r);
    } while (r > 1 && ++n < 20 && Math.abs(x - lastShift[0]) + Math.abs(y - lastShift[1]) < 2);
    lastShift = [x, y];
    root.style.setProperty('--shift-x', x + 'px');
    root.style.setProperty('--shift-y', y + 'px');
  }
  function startShift() {
    clearInterval(shiftTimer);
    shift();
    shiftTimer = setInterval(shift, Math.max(10, S.shiftEvery) * 1000);
  }

  // ================= Faces / gestures =================
  $('dots').innerHTML = faces.map(() => '<span></span>').join('');
  function setFace(i) {
    S.face = (i + faces.length) % faces.length;
    faces.forEach((f, k) => f.classList.toggle('active', k === S.face));
    [...$('dots').children].forEach((d, k) => d.classList.toggle('on', k === S.face));
    drawHands(new Date(), false);
    save();
  }
  let rotateTimer;
  function startRotate() {
    clearInterval(rotateTimer);
    if (S.rotateMin > 0) rotateTimer = setInterval(() => setFace(S.face + 1), S.rotateMin * 60e3);
  }

  let uiTimer;
  function showUI() {
    document.body.classList.add('ui');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => document.body.classList.remove('ui'), 4000);
  }
  const overlayOpen = () => $('settings').classList.contains('open') || $('hint').classList.contains('show');
  function inStack(sx, sy) {
    if (faces[S.face].id !== 'fB') return false;
    const st = $('stackB');
    return portrait ? sy >= st.offsetTop : sx >= st.offsetLeft;
  }
  let tx = null, ty = null;
  window.addEventListener('touchstart', e => {
    if (overlayOpen()) { tx = null; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchend', e => {
    if (tx === null) return;
    const [dx, dy] = deltaToStage(e.changedTouches[0].clientX - tx, e.changedTouches[0].clientY - ty);
    const [sx, sy] = toStage(tx, ty);
    tx = null;
    if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx) && inStack(sx, sy)) setWidget(S.widget + (dy < 0 ? 1 : -1));
    else if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) setFace(S.face + (dx < 0 ? 1 : -1));
    else showUI();
    requestWakeLock();
  });
  window.addEventListener('wheel', e => {
    const [sx, sy] = toStage(e.clientX, e.clientY);
    if (!overlayOpen() && inStack(sx, sy) && Math.abs(e.deltaY) > 20) setWidget(S.widget + (e.deltaY > 0 ? 1 : -1));
  }, { passive: true });
  window.addEventListener('mousedown', () => { if (!overlayOpen()) showUI(); requestWakeLock(); });
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowRight') setFace(S.face + 1);
    if (e.key === 'ArrowLeft') setFace(S.face - 1);
    if (e.key === 'ArrowDown') setWidget(S.widget + 1);
    if (e.key === 'ArrowUp') setWidget(S.widget - 1);
  });
  let resizeT;
  const relayout = () => { clearTimeout(resizeT); resizeT = setTimeout(layout, 120); };
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);

  // ================= Wake lock =================
  let wakeLock = null, wakeMsg = '';
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) { wakeMsg = 'Screen Wake Lock not supported on this iOS version. Set Auto-Lock to "Never".'; renderStatus(); return; }
    if (wakeLock && !wakeLock.released) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeMsg = 'Screen wake lock: active ✓';
      wakeLock.addEventListener('release', () => { wakeMsg = 'Screen wake lock: released (will retry)'; renderStatus(); });
    } catch (err) {
      wakeMsg = `Screen wake lock failed (${err.name}). Tap the screen once, or set Auto-Lock to "Never".`;
    }
    renderStatus();
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { requestWakeLock(); if (!W || Date.now() - W.at > 20 * 60e3) loadWeather(); }
  });
  setInterval(() => { if (!wakeLock || wakeLock.released) requestWakeLock(); }, 60e3);

  // ================= Settings UI =================
  function renderStatus() {
    $('status').innerHTML =
      `${wakeMsg || 'Screen wake lock: not requested yet'}<br>` +
      (standalone ? 'Running as Home Screen app ✓' : 'Running in a browser tab. Use Share → Add to Home Screen for full-screen mode.') +
      `<br>Swipe left/right to change faces. On the split face, swipe up/down over the widgets to change them.`;
  }
  function applySettings() {
    root.style.setProperty('--day-opacity', S.dim);
    root.style.setProperty('--night-opacity', S.nightDim);
  }
  function bindSettings() {
    const bind = (id, key, type, after) => {
      const el = $(id);
      if (type === 'check') el.checked = S[key]; else el.value = S[key];
      el.addEventListener(type === 'text' ? 'change' : 'input', () => {
        S[key] = type === 'check' ? el.checked : type === 'num' ? Number(el.value) : el.value;
        save(); applySettings(); after && after();
        lastDateKey = ''; const now = new Date(); updateText(now); drawHands(now);
        document.body.classList.toggle('night', isNightNow(now));
      });
    };
    bind('sOrient', 'orient', 'sel', layout);
    bind('s24', 'h24', 'check'); bind('sSecs', 'secs', 'check'); bind('sSmooth', 'smooth', 'check');
    bind('sDim', 'dim', 'num'); bind('sNightDim', 'nightDim', 'num');
    bind('sNight', 'night'); bind('sNightStart', 'nightStart'); bind('sNightEnd', 'nightEnd');
    bind('sCity', 'city', 'text', () => { W = null; renderWeather(); loadWeather(); });
    bind('sUnits', 'units', 'sel', () => loadWeather());
    bind('sWeek', 'week', 'num');
    bind('sWRotate', 'wRotate', 'num', startWidgetRotate);
    bind('sShiftEvery', 'shiftEvery', 'num', startShift); bind('sShiftPx', 'shiftPx', 'num', startShift);
    bind('sRotate', 'rotateMin', 'num', startRotate);
    $('gear').addEventListener('click', e => { e.stopPropagation(); $('settings').classList.add('open'); renderStatus(); });
    $('closeSettings').addEventListener('click', () => $('settings').classList.remove('open'));
    $('settings').addEventListener('click', e => { if (e.target.id === 'settings') $('settings').classList.remove('open'); });
  }

  // Browser-tab hint: the only way to lose the Safari bars on iOS is running from the Home Screen.
  function setupHint() {
    let dismissed = false;
    try { dismissed = localStorage.getItem(KEY + '.hint') === '1'; } catch (e) {}
    if (standalone || dismissed || new URLSearchParams(location.search).has('nohint')) return;
    $('hint').classList.add('show');
    $('hintOk').onclick = () => { $('hint').classList.remove('show'); try { localStorage.setItem(KEY + '.hint', '1'); } catch (e) {} };
    $('hintLater').onclick = () => $('hint').classList.remove('show');
  }

  // ================= Boot =================
  applySettings();
  bindSettings();
  layout();
  setFace(S.face);
  setWidget(S.widget, false);
  renderWeather();
  tick();
  requestAnimationFrame(sweep);
  startShift();
  startRotate();
  startWidgetRotate();
  requestWakeLock();
  renderStatus();
  setupHint();
  loadWeather();

  window.__clock = { setFace, setWidget, layout, S };
})();
</script>
</body>
</html>
