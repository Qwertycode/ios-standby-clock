<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StandBy Clock">
<meta name="theme-color" content="#000000">
<meta name="description" content="An always-on, StandBy-style nightstand clock for iPhones without an always-on display. Add it to your Home Screen.">
<title>StandBy Clock</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root {
    --white: #ffffff;
    --tick-major-a: #9f9f9f;
    --tick-minor-a: #474747;
    --tick-major-b: #f3f2f8;
    --tick-minor-b: #525252;
    --second: #e8913a;
    --red: #f14b39;
    --gray: #84848a;
    --day-opacity: 1;
    --night-opacity: .45;
    --shift-x: 0px;
    --shift-y: 0px;
    /* Set by JS from the (possibly rotated) clock area, so layouts don't depend on the screen's orientation. */
    --vh: 1vh;
    --vw: 1vw;
    --wu: 1vh;        /* widget unit: 1/100 of the widget area's height */
  }
  body.night {
    --white: #ff3b2a; --tick-major-a: #b02414; --tick-minor-a: #4a0f08;
    --tick-major-b: #ff3b2a; --tick-minor-b: #5a130a;
    --second: #ff3b2a; --red: #ff3b2a; --gray: #8a1d10;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: #000; color: var(--white); overflow: hidden;
    font-family: -apple-system, "SF Pro Display", "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  }

  /* #rot is the clock's "screen". It is rotated 90° when the chosen orientation differs from the phone's. */
  #rot { position: fixed; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #000; }
  /* #stage is the safe-area part of #rot (JS sets left/top/width/height), so notches and the status bar get a black margin. */
  #stage {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    transform: translate(var(--shift-x), var(--shift-y));
    transition: transform 2s ease-in-out, opacity 3s ease;
    opacity: var(--day-opacity);
  }
  body.night #stage { opacity: var(--night-opacity); }

  .face { display: none; position: absolute; inset: 0; }
  .face.active { display: block; }
  svg text { font-family: inherit; }

  /* ---------- Face 1: full-screen dial ---------- */
  #svgA { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---------- Face 2: two swipeable panes: clock (analog/digital) and widgets (weather/calendar) ---------- */
  /* Pane rects are set in JS. --cu / --wu are 1% of each pane's fitted content box. */
  .pane { position: absolute; overflow: hidden; }
  .track { position: absolute; inset: 0; transition: transform .55s cubic-bezier(.25,.8,.25,1); }
  .pv { position: absolute; left: 0; width: 100%; height: 100%; }
  #dialB { position: absolute; overflow: visible; }   /* size/position set in JS */
  .wbox { position: absolute; left: 50%; top: 50%; width: calc(80 * var(--wu)); height: calc(100 * var(--wu)); margin: calc(-50 * var(--wu)) 0 0 calc(-40 * var(--wu)); }

  .w-weather .city { position: absolute; top: calc(7.6 * var(--wu)); left: calc(1.1 * var(--wu)); font-size: calc(9.2 * var(--wu)); font-weight: 600; line-height: 1; white-space: nowrap; display: flex; align-items: center; gap: calc(2.2 * var(--wu)); }
  .w-weather .city svg { width: calc(5.4 * var(--wu)); height: calc(5.4 * var(--wu)); fill: var(--white); }
  .w-weather .temp { position: absolute; top: calc(16.5 * var(--wu)); left: 0; font-size: calc(42.5 * var(--wu)); font-weight: 500; line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .w-weather .icon { position: absolute; top: calc(63.5 * var(--wu)); left: calc(1.1 * var(--wu)); width: calc(9.6 * var(--wu)); height: calc(7.2 * var(--wu)); }
  .w-weather .icon svg { width: 100%; height: 100%; stroke: var(--white); fill: none; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .w-weather .cond { position: absolute; top: calc(74.6 * var(--wu)); left: calc(1.1 * var(--wu)); font-size: calc(7.8 * var(--wu)); font-weight: 500; line-height: 1; white-space: nowrap; }
  .w-weather .lohi { position: absolute; top: calc(84.6 * var(--wu)); left: calc(1.1 * var(--wu)); font-size: calc(7.8 * var(--wu)); font-weight: 500; line-height: 1; white-space: nowrap; }
  .w-weather .msg { position: absolute; top: calc(40 * var(--wu)); left: calc(1.1 * var(--wu)); right: calc(4 * var(--wu)); font-size: calc(5 * var(--wu)); color: var(--gray); line-height: 1.25; }

  .w-cal .month { position: absolute; top: calc(9.4 * var(--wu)); left: calc(-0.4 * var(--wu)); font-size: calc(6.4 * var(--wu)); font-weight: 600; color: var(--red); line-height: 1; letter-spacing: .01em; }
  .w-cal .cell { position: absolute; width: calc(11.7 * var(--wu)); height: calc(11.7 * var(--wu)); margin: calc(-5.85 * var(--wu)) 0 0 calc(-5.85 * var(--wu)); display: flex; align-items: center; justify-content: center; font-size: calc(5.9 * var(--wu)); font-weight: 600; font-variant-numeric: tabular-nums; }
  .w-cal .dow { font-size: calc(5 * var(--wu)); font-weight: 500; }
  .w-cal .we { color: var(--gray); }
  .w-cal .today::before { content: ""; position: absolute; width: calc(10.4 * var(--wu)); height: calc(10.4 * var(--wu)); border-radius: 50%; background: var(--red); z-index: -1; }
  .w-cal .today { color: #fff; z-index: 0; }
  body.night .w-cal .today { color: #000; }

  .w-time { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .w-time .t { font-size: calc(42 * var(--cu)); font-weight: 600; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .w-time .d { margin-top: calc(7 * var(--cu)); font-size: calc(8.8 * var(--cu)); font-weight: 600; line-height: 1; }
  .w-time .d b { color: var(--red); font-weight: 600; }

  .vdots { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; opacity: 0; transition: opacity .5s; }
  .vdots span { width: 7px; height: 7px; border-radius: 50%; background: #3a3a3c; }
  .vdots span.on { background: #f2f2f7; }
  .vdots.show { opacity: 1; }

  /* ---------- Face 3: big digital ---------- */
  #fD .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #fD .date { font-size: calc(7 * var(--vh)); font-weight: 600; line-height: 1; margin-bottom: calc(1 * var(--vh)); }
  #fD .date b { color: var(--red); font-weight: 600; }
  #fD .time { font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; font-size: min(calc(62 * var(--vh)), calc(30 * var(--vw))); font-weight: 700; line-height: .95; letter-spacing: -.02em; font-variant-numeric: tabular-nums; display: flex; }
  body.portrait #fD .date { font-size: calc(7.5 * var(--vw)); margin-bottom: calc(3 * var(--vw)); }
  body.portrait #fD .time { flex-direction: column; align-items: center; font-size: calc(52 * var(--vw)); line-height: .88; }
  body.portrait #fD .sep { display: none; }

  /* ---------- UI chrome (inside #rot, so it rotates with the clock) ---------- */
  #dots { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 8px; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #dots span { width: 7px; height: 7px; border-radius: 50%; background: #48484a; }
  #dots span.on { background: #f2f2f7; }
  body.ui #dots { opacity: 1; }
  #gear {
    position: absolute; top: 14px; right: 16px; width: 40px; height: 40px; border-radius: 50%; border: 0;
    background: #1c1c1e; color: #f2f2f7; font-size: 20px; opacity: 0; pointer-events: none; transition: opacity .4s; z-index: 5;
  }
  body.ui #gear { opacity: 1; pointer-events: auto; }

  #settings { position: absolute; inset: 0; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; z-index: 10; touch-action: pan-y; }
  #settings.open { display: flex; }
  #settings .card {
    background: #1c1c1e; color: #f2f2f7; border-radius: 18px; padding: 18px 20px;
    width: min(660px, 92%); max-height: 90%; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; font-size: 15px;
  }
  body.portrait #settings .card { grid-template-columns: 1fr; max-height: 80%; }
  #settings h2 { grid-column: 1 / -1; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
  #settings label { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 36px; }
  #settings input[type=time], #settings select, #settings input[type=number], #settings input[type=text] {
    background: #2c2c2e; color: #f2f2f7; border: 0; border-radius: 8px; padding: 6px 8px; font-size: 16px; font-family: inherit;
  }
  #settings input[type=number] { width: 70px; }
  #settings input[type=text] { width: 150px; }
  #settings input[type=range] { width: 130px; }
  #settings input[type=checkbox] { width: 22px; height: 22px; accent-color: #30d158; }
  #settings .cityrow { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; padding: 4px 0; }
  #settings .cityctl { display: flex; gap: 8px; align-items: center; }
  #settings .cityctl input[type=text] { flex: 1; width: auto; min-width: 0; }
  #settings .btn2 { background: #2c2c2e; color: #f2f2f7; border: 0; border-radius: 8px; padding: 7px 10px; font-size: 15px; white-space: nowrap; }
  #citySug { display: flex; flex-direction: column; background: #2c2c2e; border-radius: 8px; overflow: hidden; }
  #citySug:empty { display: none; }
  #citySug button { background: none; border: 0; border-top: 1px solid #3a3a3c; color: #f2f2f7; text-align: left; padding: 9px 10px; font-size: 15px; font-family: inherit; }
  #citySug button:first-child { border-top: 0; }
  #citySug small, #settings .small { color: #8e8e93; font-size: 13px; }
  #settings .status { grid-column: 1 / -1; font-size: 13px; color: #8e8e93; line-height: 1.45; margin-top: 4px; }
  #settings .close, #hint button { background: #0a84ff; color: #fff; border: 0; border-radius: 10px; padding: 7px 16px; font-size: 15px; font-weight: 600; }

  #hint { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.85); z-index: 20; }
  #hint.show { display: flex; }
  #hint .card { background: #1c1c1e; color: #f2f2f7; border-radius: 18px; padding: 20px 22px; width: min(440px, 90%); font-size: 15px; line-height: 1.45; }
  #hint h3 { font-size: 18px; margin-bottom: 8px; }
  #hint p { color: #c7c7cc; margin-bottom: 14px; }
  #hint .row { display: flex; justify-content: flex-end; gap: 10px; }
  #hint .later { background: #2c2c2e; }
</style>
</head>
<body>
<div id="safe" style="position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)"></div>

<div id="rot">
  <div id="stage">
    <!-- Face 1: full-screen dial -->
    <section class="face" id="fA"><svg id="svgA"></svg></section>

    <!-- Face 2: clock pane (analog / digital) + widget pane (weather / calendar), each swipeable up/down -->
    <section class="face" id="fB">
      <div class="pane" id="paneC">
        <div class="track" id="trackC">
          <div class="pv"><svg id="dialB" viewBox="-100 -100 200 200"></svg></div>
          <div class="pv w-time"><div class="t" id="wtT"></div><div class="d" id="wtD"></div></div>
        </div>
        <div class="vdots" id="dotsC"></div>
      </div>
      <div class="pane" id="paneW">
        <div class="track" id="trackB">
          <div class="pv"><div class="wbox w-weather" id="wWeather"></div></div>
          <div class="pv"><div class="wbox w-cal" id="wCal"></div></div>
        </div>
        <div class="vdots" id="dotsW"></div>
      </div>
    </section>

    <!-- Face 3: big digital -->
    <section class="face" id="fD"><div class="wrap"><div class="date" id="dDate"></div><div class="time" id="dTime"></div></div></section>
  </div>

  <div id="dots"></div>
  <button id="gear" aria-label="Settings">⚙︎</button>

  <div id="settings">
    <div class="card">
      <h2>Settings <button class="close" id="closeSettings">Done</button></h2>
      <label>Orientation
        <select id="sOrient">
          <option value="follow">Follow phone</option>
          <option value="landscape-cw">Always landscape ↻</option>
          <option value="landscape-ccw">Always landscape ↺</option>
          <option value="portrait">Always portrait</option>
        </select>
      </label>
      <label>24-hour digital time <input type="checkbox" id="s24"></label>
      <label>Second hand <input type="checkbox" id="sSecs"></label>
      <label>Smooth sweep <input type="checkbox" id="sSmooth"></label>
      <label>Day brightness <input type="range" id="sDim" min="0.25" max="1" step="0.05"></label>
      <label>Night mode
        <select id="sNight"><option value="auto">Auto (schedule)</option><option value="on">Always on</option><option value="off">Off</option></select>
      </label>
      <label>Night brightness <input type="range" id="sNightDim" min="0.15" max="0.8" step="0.05"></label>
      <label>Night starts <input type="time" id="sNightStart"></label>
      <label>Night ends <input type="time" id="sNightEnd"></label>
      <div class="cityrow">
        <div>Weather location <span class="small" id="cityNow"></span></div>
        <div class="cityctl">
          <input type="text" id="sCity" placeholder="Search for a city…" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">
          <button class="btn2" id="sHere">📍 My location</button>
        </div>
        <div id="citySug"></div>
      </div>
      <label>Units <select id="sUnits"><option value="C">°C</option><option value="F">°F</option></select></label>
      <label>Week starts <select id="sWeek"><option value="auto">Auto (from location)</option><option value="0">Sunday</option><option value="1">Monday</option><option value="6">Saturday</option></select></label>
      <label>Rotate widgets (min, 0=off) <input type="number" id="sWRotate" min="0" max="240"></label>
      <label>Pixel shift every (s) <input type="number" id="sShiftEvery" min="10" max="600"></label>
      <label>Shift range (px) <input type="number" id="sShiftPx" min="0" max="30"></label>
      <label>Rotate faces (min, 0=off) <input type="number" id="sRotate" min="0" max="240"></label>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div id="hint">
    <div class="card">
      <h3>Add to Home Screen for full screen</h3>
      <p>You're in a Safari tab, so the browser bars are visible. Tap <b>Share</b> → <b>Add to Home Screen</b>, then open the clock from its new icon. It will run full-screen with no browser UI.</p>
      <div class="row"><button class="later" id="hintLater">Not now</button><button id="hintOk">Got it</button></div>
    </div>
  </div>
</div>

<script>
(() => {
  // ================= Settings =================
  const DEFAULTS = {
    orient: 'follow', h24: true, secs: true, smooth: true, dim: 1,
    night: 'auto', nightDim: 0.45, nightStart: '22:30', nightEnd: '07:00',
    city: '', place: null, units: 'C', week: 'auto', wRotate: 10, clockSide: 'left',
    shiftEvery: 60, shiftPx: 8, rotateMin: 0, face: 0, widget: 0, clockView: 0, v: 2
  };
  const KEY = 'standbyclock';
  let S = { ...DEFAULTS };
  try { S = { ...DEFAULTS, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  if (S.v !== 2) { S.week = 'auto'; S.widget = 0; S.v = 2; save(); }   // v1 had a fixed Sunday default and 3 widgets

  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const faces = [...document.querySelectorAll('.face')];
  const fmt = (n, d = 2) => +n.toFixed(d);
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;

  // ================= Orientation / layout =================
  // rot: 0 = none, 90 = rotated clockwise, -90 = counter-clockwise.
  // SW/SH = size of the safe-area clock area (#stage); ins = its insets inside #rot.
  let rot = 0, SW = 0, SH = 0, portrait = false, ins = { t: 0, r: 0, b: 0, l: 0 };
  const PR = { c: { x: 0, y: 0, w: 0, h: 0 }, w: { x: 0, y: 0, w: 0, h: 0 } };   // split-face pane rects in stage coords
  function screenInsets() {
    const cs = getComputedStyle($('safe'));
    return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  }
  const place = (el, r) => Object.assign(el.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
  function layout() {
    const w = innerWidth, h = innerHeight;
    const phoneLand = w > h;
    let want;
    if (S.orient === 'follow') want = phoneLand ? 'land' : 'port';
    else want = S.orient === 'portrait' ? 'port' : 'land';
    rot = 0;
    if ((want === 'land') !== phoneLand) rot = S.orient === 'landscape-ccw' ? -90 : (S.orient === 'portrait' ? -90 : 90);
    const RW = rot ? h : w, RH = rot ? w : h;
    const r = $('rot');
    r.style.width = RW + 'px'; r.style.height = RH + 'px';
    r.style.transform = rot === 90 ? `translate(${w}px,0) rotate(90deg)` : rot === -90 ? `translate(0,${h}px) rotate(-90deg)` : 'none';
    portrait = RW < RH;
    // Map the screen's safe-area insets (notch / Dynamic Island, status bar, home indicator) into #rot's frame.
    const s = screenInsets();
    const m = rot === 90 ? { t: s.r, r: s.b, b: s.l, l: s.t } : rot === -90 ? { t: s.l, r: s.t, b: s.r, l: s.b } : s;
    // Portrait: keep clear of the top and bottom. Landscape: keep clear of the notch side, symmetrically so faces stay centred.
    if (portrait) ins = { t: m.t, b: m.b, l: 0, r: 0 };
    else { const x = Math.max(m.l, m.r); ins = { t: 0, b: 0, l: x, r: x }; }
    SW = RW - ins.l - ins.r; SH = RH - ins.t - ins.b;
    place($('stage'), { x: ins.l, y: ins.t, w: SW, h: SH });
    $('gear').style.top = (ins.t + (portrait ? 8 : 14)) + 'px';
    $('gear').style.right = (ins.r + 16) + 'px';
    $('dots').style.bottom = Math.max(12, ins.b) + 'px';
    document.body.classList.toggle('portrait', portrait);
    root.style.setProperty('--vh', SH / 100 + 'px');
    root.style.setProperty('--vw', SW / 100 + 'px');
    // Split face: two equal halves (side by side in landscape, stacked in portrait); the clock takes the chosen side.
    const halves = portrait
      ? [{ x: 0, y: 0, w: SW, h: SH / 2 }, { x: 0, y: SH / 2, w: SW, h: SH / 2 }]
      : [{ x: 0, y: 0, w: SW / 2, h: SH }, { x: SW / 2, y: 0, w: SW / 2, h: SH }];
    const clockFirst = S.clockSide !== 'right';
    PR.c = halves[clockFirst ? 0 : 1]; PR.w = halves[clockFirst ? 1 : 0];
    place($('paneC'), PR.c); place($('paneW'), PR.w);
    const size = Math.min(PR.c.w * .9, PR.c.h * .86);
    Object.assign($('dialB').style, { width: size + 'px', height: size + 'px', left: (PR.c.w - size) / 2 + 'px', top: (PR.c.h - size) / 2 + 'px' });
    // Content boxes are scaled to fit their pane in both directions: digital time ~115 x 100 units, widgets 80 x 100.
    $('paneC').style.setProperty('--cu', Math.min(PR.c.h / 100, PR.c.w * .92 / 115) + 'px');
    $('paneW').style.setProperty('--wu', Math.min(PR.w.h / 100, PR.w.w * .9 / 80) + 'px');
    buildA();
    const now = new Date();
    lastDateKey = '';
    drawHands(now);
    updateText(now);
  }
  // Convert a screen point/delta into clock-area coordinates.
  const toStage = (x, y) => rot === 90 ? [y, innerWidth - x] : rot === -90 ? [innerHeight - y, x] : [x, y];
  const deltaToStage = (dx, dy) => rot === 90 ? [dy, -dx] : rot === -90 ? [-dy, dx] : [dx, dy];

  // ================= Hands =================
  // Rotated with the SVG transform attribute: CSS transform-origin on SVG is unreliable in iOS Safari.
  function handSVG(cls, cx, cy, stemLen, stemW, len, w, color) {
    return `<g class="${cls}" transform="rotate(0 ${cx} ${cy})">
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${fmt(cy - stemLen - w / 2)}" stroke="${color}" stroke-width="${stemW}" stroke-linecap="round"/>
      <line x1="${cx}" y1="${fmt(cy - stemLen)}" x2="${cx}" y2="${fmt(cy - len + w / 2)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>
    </g>`;
  }
  function secondSVG(cx, cy, fwd, back, w, hubW, hubO, hubB) {
    return `<circle cx="${cx}" cy="${cy}" r="${hubW}" fill="var(--white)"/>
      <g class="hs" transform="rotate(0 ${cx} ${cy})">
        <line x1="${cx}" y1="${fmt(cy + back)}" x2="${cx}" y2="${fmt(cy - fwd)}" stroke="var(--second)" stroke-width="${w}" stroke-linecap="round"/>
      </g>
      <circle cx="${cx}" cy="${cy}" r="${hubO}" fill="var(--second)"/>
      <circle cx="${cx}" cy="${cy}" r="${hubB}" fill="#000"/>`;
  }

  // ================= Face 1: full-screen dial =================
  // Ticks run along rays from the centre and end on the screen edge, so the dial follows the
  // screen's rectangle. Sizes are fractions of U = the shorter side.
  let A = null;
  function buildA() {
    const svg = $('svgA');
    const W = SW, H = SH, U = Math.min(W, H);
    if (!W || !H) return;

      if (i % 15 === 0)     { len = shortAxis ? .05 * U : .19 * U; w = .0075 * U; col = 'var(--tick-major-a)'; }

    html += handSVG('hm', cx, cy, .065 * U, .012 * U, .455 * U * (land ? 1 : .98), .038 * U, 'var(--white)');

  // The face-1 date goes right of the hub (landscape) or below it (portrait). On near-square screens the
  // preferred slot gets squeezed by the 3 / 6 numerals, so fall back to the other slot, then to a smaller font.
  function placeDate() {
    const t = A && A.date;

    const { U, cx, cy, x3, y6, fs, land } = A.g;
    const base = .058 * U * (land ? 1 : 1.25);
    t.setAttribute('font-size', fmt(base));
    const len = t.getComputedTextLength() || base * 3.7;          // width at the base size
    const hub = .05 * U, gap = .03 * U, capH = .72;                // capH: cap height / font size
    const rL = cx + hub + gap, rR = x3 - .39 * fs - gap;           // right slot: hub .. left edge of "3"
    const bT = cy + hub + gap, bB = y6 - capH / 2 * fs - gap;      // below slot: hub .. top of "6"
    const fitR = Math.min(1, (rR - rL) / len), fitB = Math.min(1, (bB - bT) / (capH * base), A.g.W * .8 / len);
    const useR = land ? (fitR >= 1 || fitR >= fitB) : (fitB < 1 && fitR > fitB);
    const size = base * (useR ? fitR : fitB);

    } else {

      const y = Math.min(cy + .3 * U, bB - half);                  // original spot when it fits

  // ================= Calendar widget =================

      `<div class="icon"><svg viewBox="0 0 32 26">${ICON[icon]}</svg></div>` +

  const geocode = async (q, count) => {

  function paneAt(sx, sy) {

    tx = null;
    const p = paneAt(sx, sy);
    if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx) && p) setStack(p, S[stacks[p].key] + (dy < 0 ? 1 : -1));
    else if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) setFace(S.face + (dx < 0 ? 1 : -1));
    else {
      // Double-tap on the split face swaps the clock and widget sides.
      const t = Date.now();
      if (paneAt(sx, sy) && t - lastTap < 350) { swapSides(); lastTap = 0; } else { lastTap = t; showUI(); }
    }
    requestWakeLock();
  });
  window.addEventListener('wheel', e => {
    const [sx, sy] = toStage(e.clientX, e.clientY);
    const p = paneAt(sx, sy);
    if (!overlayOpen() && p && Math.abs(e.deltaY) > 20) setStack(p, S[stacks[p].key] + (e.deltaY > 0 ? 1 : -1));
  }, { passive: true });
  window.addEventListener('dblclick', e => {
    const [sx, sy] = toStage(e.clientX, e.clientY);
    if (!overlayOpen() && paneAt(sx, sy) && Date.now() - lastTouchEnd > 1000) swapSides();   // mouse only; touch handled above
  });
  window.addEventListener('mousedown', () => { if (!overlayOpen()) showUI(); requestWakeLock(); });
  // Desktop keyboard controls (listed in Settings and the README).
  const openSettings = () => { $('hint').classList.remove('show'); $('settings').classList.add('open'); renderStatus(); };
  const closeSettings = () => { $('settings').classList.remove('open'); if (document.activeElement) document.activeElement.blur(); };
  function toggleFullscreen() {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else if (el.requestFullscreen || el.webkitRequestFullscreen) (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  }
  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;              // leave browser shortcuts alone
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === 'Escape') { $('hint').classList.remove('show'); closeSettings(); return; }
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
    if ($('settings').classList.contains('open')) { if (k === 's' || k === ',') closeSettings(); return; }
    if ($('hint').classList.contains('show')) return;
    const act = e.shiftKey ? {
      // Shift+←/→ moves the split face's clock to that side (left = top in portrait); Shift+↑/↓ flips analog ↔ digital.
      ArrowLeft: () => clockTo('left'), ArrowRight: () => clockTo('right'), h: () => clockTo('left'), l: () => clockTo('right'),
      ArrowUp: () => setStack('c', S.clockView - 1), ArrowDown: () => setStack('c', S.clockView + 1),
      k: () => setStack('c', S.clockView - 1), j: () => setStack('c', S.clockView + 1)
    }[k] : {
      ArrowRight: () => setFace(S.face + 1), ArrowLeft: () => setFace(S.face - 1),
      l: () => setFace(S.face + 1), h: () => setFace(S.face - 1),
      ArrowDown: () => setWidget(S.widget + 1), ArrowUp: () => setWidget(S.widget - 1),
      j: () => setWidget(S.widget + 1), k: () => setWidget(S.widget - 1),
      s: openSettings, ',': openSettings, f: toggleFullscreen
    }[k] || (/^[1-9]$/.test(k) && +k <= faces.length ? () => setFace(+k - 1) : null);
    if (!act) return;
    e.preventDefault();
    act();
    if (k !== 's' && k !== ',' && k !== 'f') showUI();           // flash the page dots so the change is visible
  });
  let resizeT;
  const relayout = () => { clearTimeout(resizeT); resizeT = setTimeout(layout, 120); };
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);

  // ================= Wake lock =================
  let wakeLock = null, wakeMsg = '';
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) { wakeMsg = 'Screen Wake Lock not supported on this iOS version. Set Auto-Lock to "Never".'; renderStatus(); return; }
    if (wakeLock && !wakeLock.released) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeMsg = 'Screen wake lock: active ✓';
      wakeLock.addEventListener('release', () => { wakeMsg = 'Screen wake lock: released (will retry)'; renderStatus(); });
    } catch (err) {
      wakeMsg = `Screen wake lock failed (${err.name}). Tap the screen once, or set Auto-Lock to "Never".`;
    }
    renderStatus();
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { requestWakeLock(); layout(); if (!W || Date.now() - W.at > 20 * 60e3) loadWeather(); }
  });
  setInterval(() => { if (!wakeLock || wakeLock.released) requestWakeLock(); }, 60e3);

  // ================= Settings UI =================
  function renderStatus() {
    $('status').innerHTML =
      (weatherMsg ? `${esc(weatherMsg)}<br>` : '') +
      `${wakeMsg || 'Screen wake lock: not requested yet'}<br>` +
      (standalone ? 'Running as Home Screen app ✓' : 'Running in a browser tab. Use Share → Add to Home Screen for full-screen mode.') +
      `<br>Settings are saved on this phone and kept between launches.` +
      `<br>Swipe left/right to change faces. On the split face, swipe up/down over the clock (analog ↔ digital) or over the widgets (weather ↔ calendar). Double-tap it to swap the clock's side.` +
      `<br>Keyboard: ← → or 1–${faces.length} faces · ↑ ↓ widgets · Shift+↑ ↓ analog/digital · Shift+← → clock side · S settings · F full screen · Esc close.`;
  }
  function applySettings() {
    root.style.setProperty('--day-opacity', S.dim);
    root.style.setProperty('--night-opacity', S.nightDim);
  }
  function syncCityUI() {
    const inp = $('sCity');
    if (document.activeElement !== inp) inp.value = S.place ? S.place.label : '';
    $('cityNow').textContent = S.place ? '' : (W && W.here ? `· current location (${W.name})` : '· current location');
  }
  function choosePlace(p) {
    S.place = p; S.city = p ? p.name : '';
    save(); W = null; $('citySug').innerHTML = ''; $('sCity').blur();
    syncCityUI(); renderWeather(); lastDateKey = ''; updateText(new Date());
    loadWeather(true);
  }
  function bindCity() {
    const inp = $('sCity'), sug = $('citySug');
    let results = [], timer, seq = 0;
    syncCityUI();
    inp.addEventListener('input', () => {
      clearTimeout(timer);
      const q = inp.value.trim();
      if (q.length < 2) { results = []; sug.innerHTML = ''; return; }
      timer = setTimeout(async () => {
        const my = ++seq;
        try {
          const res = await geocode(q, 8);
          if (my !== seq) return;
          results = res.map(placeFrom);
          sug.innerHTML = results.length
            ? results.map((p, i) => `<button data-i="${i}">${esc(p.name)} <small>${esc(p.label.slice(p.name.length + 2))}</small></button>`).join('')
            : '<button disabled><small>No matches</small></button>';
        } catch (e) { if (my === seq) sug.innerHTML = '<button disabled><small>Search failed (offline?)</small></button>'; }
      }, 250);
    });
    sug.addEventListener('click', e => {
      const b = e.target.closest('button[data-i]');
      if (b) choosePlace(results[+b.dataset.i]);
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && results.length) { e.preventDefault(); choosePlace(results[0]); } });
    inp.addEventListener('blur', () => setTimeout(() => {
      if (!inp.value.trim() && S.place) choosePlace(null);   // cleared the field: back to current location
      else if (document.activeElement !== inp) { syncCityUI(); }
    }, 300));
    $('sHere').addEventListener('click', () => { results = []; sug.innerHTML = ''; inp.value = ''; choosePlace(null); });
  }
  function bindSettings() {
    const bind = (id, key, type, after) => {
      const el = $(id);
      if (type === 'check') el.checked = S[key]; else el.value = S[key];
      el.addEventListener(type === 'text' ? 'change' : 'input', () => {
        S[key] = type === 'check' ? el.checked : type === 'num' ? Number(el.value) : el.value;
        save(); applySettings(); after && after();
        lastDateKey = ''; const now = new Date(); updateText(now); drawHands(now);
        document.body.classList.toggle('night', isNightNow(now));
      });
    };
    bind('sOrient', 'orient', 'sel', layout);
    bind('s24', 'h24', 'check'); bind('sSecs', 'secs', 'check'); bind('sSmooth', 'smooth', 'check');
    bind('sDim', 'dim', 'num'); bind('sNightDim', 'nightDim', 'num');
    bind('sNight', 'night'); bind('sNightStart', 'nightStart'); bind('sNightEnd', 'nightEnd');
    bindCity();
    bind('sUnits', 'units', 'sel', () => loadWeather(true));
    bind('sWeek', 'week', 'sel');
    bind('sWRotate', 'wRotate', 'num', startWidgetRotate);
    bind('sShiftEvery', 'shiftEvery', 'num', startShift); bind('sShiftPx', 'shiftPx', 'num', startShift);
    bind('sRotate', 'rotateMin', 'num', startRotate);
    $('gear').addEventListener('click', e => { e.stopPropagation(); openSettings(); });
    $('closeSettings').addEventListener('click', closeSettings);
    $('settings').addEventListener('click', e => { if (e.target.id === 'settings') $('settings').classList.remove('open'); });
  }

  // Browser-tab hint: the only way to lose the Safari bars on iOS is running from the Home Screen.
  function setupHint() {
    let dismissed = false;
    try { dismissed = localStorage.getItem(KEY + '.hint') === '1'; } catch (e) {}
    if (standalone || dismissed || new URLSearchParams(location.search).has('nohint')) return;
    $('hint').classList.add('show');
    $('hintOk').onclick = () => { $('hint').classList.remove('show'); try { localStorage.setItem(KEY + '.hint', '1'); } catch (e) {} };
    $('hintLater').onclick = () => $('hint').classList.remove('show');
  }

  // ================= Boot =================
  applySettings();
  bindSettings();
  layout();
  setFace(S.face);
  setWidget(S.widget, false);
  setStack('c', S.clockView, false);
  renderWeather();
  tick();
  requestAnimationFrame(sweep);
  startShift();
  startRotate();
  startWidgetRotate();
  requestWakeLock();
  renderStatus();
  setupHint();
  loadWeather();

  window.__clock = { setFace, setWidget, setStack, layout, S };
})();
</script>
</body>
</html>
